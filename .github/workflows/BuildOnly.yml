name: BuildOnly

on:
  push:
    branches-ignore:
      - main

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj
            **/global.json
            **/nuget.config

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Run: Compile'
        run: ./build.cmd Compile

      
      - name: Tests + Coverage (MTP)
        shell: bash
        working-directory: 'src'
        run: |
          set -euo pipefail
          # Test projects explicitly so MAUI examples do not require a device during discovery.
          mapfile -d '' test_projects < <(find tests -name '*.Tests.csproj' -print0 | sort -z)
          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo '::error::No test projects were found.'
            exit 1
          fi
          for project in "${test_projects[@]}"; do
            project_name="$(basename "$project" .csproj)"
            dotnet test --project "$project" \
              --configuration Release \
              --coverage \
              --coverage-output-format cobertura \
              --results-directory "$GITHUB_WORKSPACE/src/TestResults/$project_name"
          done

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: tmp-coverage
          path: |
            ./**/TestResults/**/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 3
